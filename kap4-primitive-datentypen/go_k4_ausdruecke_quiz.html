<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selbsttest: Operatoren und Ausdrücke</title>
  <style>
    :root { --bg:#f7f9fc;--card:#fff;--text:#1f2937;--muted:#4b5563;--line:#e5e7eb;--accent:#0f766e;--gut:#10b981;--gut-bg:#d1fae5;--rot:#dc2626;--rot-bg:#fee2e2;--highlight:#fef3c7; }
    * { box-sizing:border-box; }
    body { margin:0;font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;color:var(--text);background:radial-gradient(circle at 18% -12%,#d9fbe8 0%,#f7f9fc 46%);line-height:1.6; }
    .container { max-width:1000px;margin:0 auto;padding:24px; }
    .hero { background:linear-gradient(135deg,#0f766e 0%,#1e40af 100%);color:#fff;border-radius:14px;padding:24px;box-shadow:0 10px 24px rgba(15,118,110,.25);margin-bottom:20px; }
    .hero h1 { margin:0 0 10px;font-size:1.9rem; }
    .hero p { margin:0;opacity:.96;font-size:1.05rem; }
    .card { background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px; }
    h2 { margin:0 0 12px;font-size:1.1rem;color:var(--accent); }
    a { color:#1e40af; }
    code { background:#f3f4f6;padding:2px 7px;border-radius:6px;font-family:Consolas,"Courier New",monospace;font-size:.92rem; }
    pre { margin:0 0 12px;background:#1e293b;color:#e2e8f0;border-radius:8px;padding:12px 14px;font-family:Consolas,monospace;font-size:.95rem;line-height:1.5;white-space:pre;overflow-x:auto; }
    .antworten { display:grid;gap:8px; }
    .antwort { display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:2px solid var(--line);border-radius:8px;padding:10px 14px;font-size:1rem;font-family:inherit;background:#f9fafb;color:#111827;cursor:pointer; }
    .antwort:hover:not(:disabled) { border-color:var(--accent); }
    .antwort .buchstabe { font-weight:700;color:var(--muted); }
    .antwort.gewaehlt { background:#f0fdfa;border-color:var(--accent); }
    .antwort.richtig { background:var(--gut-bg);border-color:var(--gut); }
    .antwort.falsch { background:var(--rot-bg);border-color:var(--rot); }
    .antwort:disabled { cursor:default;color:#111827; }
    .aufloesung { margin-top:12px;padding:12px 14px;border-radius:8px;border-left:4px solid var(--gut);background:var(--gut-bg); }
    .aufloesung.falsch { border-left-color:var(--rot);background:var(--rot-bg); }
    .aufloesung.offen { border-left-color:#f59e0b;background:var(--highlight); }
    .zeile { display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 18px; }
    button.knopf { border:1px solid var(--line);border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:1rem;background:#f3f4f6;color:#111827;font-family:inherit; }
    button.knopf.haupt { background:var(--accent);color:#fff;border-color:var(--accent); }
    button:focus-visible,a:focus-visible { outline:2px solid var(--accent);outline-offset:2px; }
    .ergebnis { background:linear-gradient(135deg,#0f766e 0%,#1e40af 100%);color:#fff;border-radius:12px;padding:20px;text-align:center;font-size:1.3rem;font-weight:600;margin-bottom:18px; }
    .zurueck { display:inline-block;margin:4px 0 24px;color:var(--muted);font-size:.95rem; }
  </style>
</head>
<body>
<div class="container">

  <div class="hero">
    <h1>Selbsttest: Operatoren und Ausdrücke</h1>
    <p>12 Fragen mit je vier Antworten. Kurstext v3.0.6, Abschnitt 4.1 bis 4.1.2, Seiten 45–52.</p>
  </div>

  <p>Die Erklärungen zu den Fragen stehen auf der Seite <a href="go_k4_ausdruecke_interaktiv.html">Operatoren und Ausdrücke in Go</a>.</p>

  <div id="fragen"></div>

  <div class="zeile">
    <button class="knopf haupt" id="auswerten" type="button">Quiz auswerten</button>
    <button class="knopf" id="vonvorn" type="button">von vorn</button>
  </div>
  <div id="ergebnis"></div>

  <a class="zurueck" href="../index.html">← Zurück zur Startseite</a>
</div>

<script>
(function () {
  // f: Frage, c: Go-Code zur Frage, a: vier Antworten, r: Index der richtigen Antwort, l: Auflösung
  const FRAGEN = [
    { f: 'Was ist im Ausdruck 5 + 8 die Zahl 5?',
      a: ['der Operator', 'ein Operand', 'die Auswertung', 'eine Anweisung'], r: 1,
      l: '+ ist der Operator, 5 und 8 sind seine Operanden. Zusammen bilden sie einen Ausdruck. Go rechnet ihn aus und erhält seinen Wert 13. Das Ausrechnen heißt Auswertung.' },
    { f: 'Welcher Ausdruck enthält einen unären Operator?',
      a: ['a + b', 'a % b', '!a', 'a && b'], r: 2,
      l: 'Ein unärer Operator hat einen Operanden und steht davor, wie ! in !a oder - in -a. Die übrigen drei Operatoren sind binär: Sie haben zwei Operanden und stehen zwischen ihnen.' },
    { f: 'Für welche Typen ist der Operator % festgelegt?',
      a: ['nur für Ganzzahlen', 'für Ganzzahlen und Gleitkommazahlen', 'für Zahlen und Strings', 'für alle primitiven Typen'], r: 0,
      l: 'Der Operator % berechnet den Rest der Division. Laut Tabelle 4.1 im Kurstext ist er nur für Ganzzahlen festgelegt.' },
    { f: 'x hat den Typ int, t den Typ float64. Was geschieht bei x + t?',
      a: ['Go wandelt x in float64 um und addiert.', 'Go übersetzt das Programm nicht.', 'Go wandelt t in int um und addiert.', 'Das Programm bricht erst beim Lauf ab.'], r: 1,
      l: 'Beide Operanden eines binären Operators müssen den gleichen Typ haben. Go meldet: invalid operation: x + t (mismatched types int and float64).' },
    { f: 'Was gibt das Programm aus?',
      c: 'var tempC float64 = 20\nfmt.Println(32 + tempC*1.8)',
      a: ['68', 'Go übersetzt das Programm nicht.', '52', '36'], r: 0,
      l: '32 ist ein Integer-Literal, der andere Operand eine Gleitkommazahl. Go passt den Typ des Literals an, das heißt implizite Typanpassung. Wegen Punkt vor Strich gilt: 20 · 1,8 = 36, und 36 + 32 ergibt 68.' },
    { f: 'Welche dieser Zeilen ist ein Ausdruck?',
      a: ['x = 5', 'var y int', 'tempC - 4', 'x++'], r: 2,
      l: 'Ein Ausdruck ist alles, was einen Wert hat. tempC - 4 hat einen Wert. x = 5 und x++ sind Anweisungen, var y int ist eine Deklaration. Sie haben keinen Wert.' },
    { f: 'Was geschieht, wenn in main die Zeile x + 1 allein steht?',
      a: ['Go übersetzt das Programm und verwirft den Wert.', 'Go übersetzt das Programm nicht, weil der Wert nirgends verwendet wird.', 'Go erhöht x um 1.', 'Go gibt den Wert aus.'], r: 1,
      l: 'Ein Ausdruck allein ist keine Anweisung. Go meldet: x + 1 (value of type int) is not used. Ein Funktionsaufruf wie fmt.Println(x) bildet die Ausnahme: Er ist zugleich Ausdruck und Anweisung.' },
    { f: 'Was gibt das Programm aus?',
      c: 'fmt.Println(8 / 4 * 5)',
      a: ['10', '0', '0.4', '2'], r: 0,
      l: '/ und * binden gleich stark. Dann rechnet Go von links nach rechts: 8 / 4 ergibt 2, und 2 * 5 ergibt 10. Das heißt Linksassoziativität.' },
    { f: 'x hat den Typ int und den Wert 3. Was gibt das Programm aus?',
      c: 'fmt.Println(10+x*5 >= 50 || x < 1)',
      a: ['true', '25', 'Go übersetzt den Ausdruck nicht.', 'false'], r: 3,
      l: 'Rechnen bindet stärker als Vergleichen, und Vergleichen bindet stärker als ||. 10 + 3 * 5 ist 25, und 25 >= 50 ist false. 3 < 1 ist ebenfalls false. false || false ergibt false.' },
    { f: 'fix ist eine Konstante. Was geschieht?',
      c: 'const fix = 15\nfmt.Println(100 / (3*5 - fix))',
      a: ['Das Programm gibt 0 aus.', 'Das Programm bricht beim Lauf ab.', 'Go übersetzt das Programm nicht.', 'Das Programm gibt +Inf aus.'], r: 2,
      l: '3*5 - fix ist ein konstanter Ausdruck. Der Compiler berechnet ihn schon beim Übersetzen und erkennt die Division durch 0. Go meldet: invalid operation: division by zero.' },
    { f: 'fix ist jetzt eine Variable. Was geschieht?',
      c: 'var fix = 15\nfmt.Println(100 / (3*5 - fix))',
      a: ['Go übersetzt das Programm nicht.', 'Das Programm gibt 0 aus.', 'Das Programm gibt +Inf aus.', 'Das Programm bricht beim Lauf ab.'], r: 3,
      l: 'Mit einer Variable steht der Wert erst beim Lauf fest. Go übersetzt das Programm, und es bricht beim Lauf ab: panic: runtime error: integer divide by zero.' },
    { f: 'x ist eine Variable, f eine Funktion. Welcher Ausdruck ist ein konstanter Ausdruck?',
      a: ['x*x + 1', 'f() * 2', 'x - x', '3*5 - 1'], r: 3,
      l: 'Ein konstanter Ausdruck besteht nur aus Literalen und Konstanten. Sein Wert steht schon beim Übersetzen fest. Sobald eine Variable oder ein Funktionsaufruf vorkommt, steht der Wert erst beim Lauf fest, auch bei x - x.' }
  ];

  const el = id => document.getElementById(id);
  const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const wahl = {};
  let fertig = false;

  function zeige() {
    el('fragen').innerHTML = FRAGEN.map((q, i) => {
      const g = wahl[i];
      let s = '<div class="card"><h2>Frage ' + (i + 1) + ': ' + esc(q.f) + '</h2>' + (q.c ? '<pre>' + esc(q.c) + '</pre>' : '') + '<div class="antworten">';
      q.a.forEach((t, k) => {
        const kl = fertig ? (k === q.r ? ' richtig' : (k === g ? ' falsch' : '')) : (k === g ? ' gewaehlt' : '');
        s += '<button type="button" class="antwort' + kl + '" data-frage="' + i + '" data-antwort="' + k + '"' + (fertig ? ' disabled' : '') + '><span class="buchstabe">' + 'ABCD'[k] + ')</span><span>' + esc(t) + '</span></button>';
      });
      s += '</div>';
      if (fertig) {
        const art = g === undefined ? 'offen' : (g === q.r ? '' : 'falsch');
        const vor = g === undefined ? 'Keine Antwort gewählt. Richtig ist ' + 'ABCD'[q.r] + '. ' : (g === q.r ? 'Richtig. ' : 'Falsch, richtig ist ' + 'ABCD'[q.r] + '. ');
        s += '<div class="aufloesung ' + art + '">' + vor + esc(q.l) + '</div>';
      }
      return s + '</div>';
    }).join('');
    if (fertig) {
      const n = FRAGEN.filter((q, i) => wahl[i] === q.r).length;
      el('ergebnis').innerHTML = '<div class="ergebnis">' + n + ' von ' + FRAGEN.length + ' Fragen richtig</div>';
    } else el('ergebnis').innerHTML = '';
    el('auswerten').disabled = fertig;
  }

  el('fragen').addEventListener('click', ev => {
    const k = ev.target.closest('[data-frage]');
    if (!k || fertig) return;
    wahl[k.dataset.frage] = Number(k.dataset.antwort);
    document.querySelectorAll('[data-frage="' + k.dataset.frage + '"]').forEach(b => b.classList.toggle('gewaehlt', b === k));
  });
  el('auswerten').onclick = () => { fertig = true; zeige(); el('ergebnis').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
  el('vonvorn').onclick = () => { for (const k in wahl) delete wahl[k]; fertig = false; zeige(); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  zeige();
})();
</script>
</body>
</html>
